concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}
name: ci

'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - dev
    - master
    - main

jobs:
  context:
    permissions:
      contents: read
    name: ci / context
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@master

  check:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: ci / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # No lockfile is committed (see .gitignore). `npm ci` and `cache: npm`
      # both require one and fail the job before lint runs.
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  workflow-policy:
    name: ci / workflows
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: MolCrafts/molcrafts-ci/actions/check-workflows@master
